services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nerdose
      POSTGRES_USER: nerdose_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - nerdose-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nerdose_owner -d nerdose']
      interval: 5s
      retries: 10
volumes:
  nerdose-pgdata:
