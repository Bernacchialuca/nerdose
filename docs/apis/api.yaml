openapi: 3.0.3
info:
  title: nerdose API
  version: 0.1.0
  description: |
    Única interfaz HTTP de nerdose (servicio `api`, Node 24 + Hono).

    - **Jugador** (`nerdose.dev/api/*`): sesión anónima con la cookie `nd_pid`, estado del día,
      partidas, reportes, estadísticas y preferencias.
    - **Admin** (`admin.nerdose.dev/api/admin/*`): login, reportes, anulación, próximos desafíos,
      regeneración, stock de contenido y métricas, con `Authorization: Bearer <JWT>`.

    Convenciones (ADR-015):
    - JSON en `snake_case`, con los mismos nombres que el dominio y la DB.
    - Errores: `{ "error": { "code": "<code>", "message": "<texto en el locale>" } }`.
    - Locale de la respuesta: `?lang=` → `players.locale` → `Accept-Language` → `es`. Las rutas de
      jugador nunca devuelven objetos `{ es, en }`: el texto llega resuelto. El admin recibe el `payload`
      completo con ambos idiomas.
    - "Hoy" lo calcula siempre el servidor (día UTC). Las mutaciones de partida llevan `challenge_number`
      para detectar la jugada tardía (`409 challenge_expired`, ADR-008).
    - Antes de que la Play termine, ninguna respuesta incluye datos del `payload` fuera de `public_view`
      (anti-spoiler, ADR-006).
    - Rutas sin versión (ADR-015).
  contact:
    name: Responsable de nerdose
externalDocs:
  description: Arquitectura del producto
  url: ../prd/architecture.md

servers:
  - url: https://nerdose.dev
    description: Producción, rutas de jugador (`/api/*`)
  - url: https://admin.nerdose.dev
    description: Producción, rutas de admin (`/api/admin/*`)
  - url: http://localhost:3000
    description: Desarrollo local (api directa)

tags:
  - name: Health
    description: Chequeos de salud
  - name: Session
    description: Jugador anónimo y preferencias (Identity)
  - name: Today
    description: Estado del día y catálogo
  - name: Gameplay
    description: Partida del desafío de hoy, genérica sobre el registry de GameDefinition
  - name: Reports
    description: Reportes de problemas de los jugadores
  - name: Stats
    description: Estadísticas del jugador (Progress)
  - name: Admin
    description: Operación del responsable (JWT)

paths:
  # ───────────────────────────── Health ─────────────────────────────
  /api/health:
    get:
      tags: [Health]
      summary: Salud de la api (ruta de jugador)
      operationId: getHealth
      security: []
      responses:
        '200':
          description: La api está viva y llega a la base
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: La api no llega a la base
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: degraded, db: error }

  /api/admin/health:
    get:
      tags: [Health]
      summary: Salud de la api (ruta de admin)
      description: Mismo chequeo que `/api/health`, accesible desde `admin.nerdose.dev`. No exige JWT.
      operationId: getAdminHealth
      security: []
      responses:
        '200':
          description: La api está viva y llega a la base
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: La api no llega a la base
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ───────────────────────────── Session ─────────────────────────────
  /api/session:
    post:
      tags: [Session]
      summary: Crear o renovar la sesión anónima
      description: |
        Idempotente (F1, C-01). Si la cookie `nd_pid` es válida y el Player existe, renueva la cookie y
        actualiza `last_seen_at`. Si no, crea un Player (`locale` desde `Accept-Language` ∈ {es,en}, si no
        `es`; `preferred_code_language = js`) y emite `Set-Cookie: nd_pid`. El front lo llama en cada carga.

        Rate limit: 20 / 10 min por IP.
      operationId: createSession
      security:
        - {}
        - playerCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Sesión creada o renovada
          headers:
            Set-Cookie:
              description: '`nd_pid=<players.id>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=34560000`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
              example: { locale: es, preferred_code_language: js, created: true }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/me/preferences:
    patch:
      tags: [Session]
      summary: Cambiar preferencias del jugador
      description: |
        Cambia el idioma y/o el lenguaje de código preferido (F13, C-03). Emite `PlayerPreferencesChanged`.
        Al cambiar el locale a mitad de partida, el front vuelve a pedir `GET /api/games/{game_id}/today`.

        Rate limit: 30 / min por `player_id`.
      operationId: updatePreferences
      security:
        - playerCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesUpdate' }
            example: { locale: en }
      responses:
        '200':
          description: Preferencias actualizadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
              example: { locale: en, preferred_code_language: js }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────────── Today ─────────────────────────────
  /api/today:
    get:
      tags: [Today]
      summary: Estado del día y de los 5 juegos para el jugador
      description: |
        F1, C-05, C-06. Funciona sin cookie (`has_session: false`, `play_status: null`, rachas en 0).
        `challenge_status` + `play_status` cubren los 5 estados de la home: sin jugar (`published` + `null`),
        en curso (`in_progress`), completado (`won`/`lost`), sin desafío (`none`) y anulado (`voided`).

        Cuando `seconds_to_reset` llega a 0, el front espera 0–3 s al azar y vuelve a pedir.
      operationId: getToday
      security:
        - {}
        - playerCookie: []
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Estado del día
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Today' }
              example:
                date: '2026-11-03'
                number: 128
                next_reset_at: '2026-11-04T00:00:00Z'
                seconds_to_reset: 41000
                has_session: true
                global_streak: { current: 5, max: 12 }
                completed_today: 1
                games:
                  - { game_id: devdle, challenge_status: published, play_status: won, history_label: '✓ 4/6', current_streak: 5 }
                  - { game_id: grep-grid, challenge_status: published, play_status: in_progress, history_label: null, current_streak: 2 }
                  - { game_id: timeline, challenge_status: published, play_status: lost, history_label: '3/5', current_streak: 1 }
                  - { game_id: big-o, challenge_status: none, play_status: null, history_label: null, current_streak: 3 }
                  - { game_id: bug-hunt, challenge_status: voided, play_status: null, history_label: null, current_streak: 1 }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────────── Gameplay ─────────────────────────────
  /api/games/{game_id}/today:
    get:
      tags: [Gameplay]
      summary: Abrir el juego de hoy (vista pública + partida)
      description: |
        F2, C-08, C-10, C-14. Devuelve la vista pública del desafío de hoy (sin solución) y la Play del
        jugador, si existe. Si la Play terminó, incluye el `result`.

        - `play == null` → pantalla de instrucciones.
        - `play.status == in_progress` → retoma con `play.state`.
        - Play terminada → pantalla de resultado.
        - `challenge_status: none` → "sin desafío hoy"; `voided` → aviso de anulación.

        En Big O y Bug Hunt, `public_view.code` trae los 3 lenguajes: cambiar de lenguaje es solo del cliente.

        Grep Grid: `public_view = toPublic(payload, locale, state)`; la `api` pasa el `state` solo si la Play
        está `in_progress`. `words[].definition` viene únicamente en las palabras ya encontradas por esa Play,
        en el locale resuelto (retomar y cambio de idioma); nunca en las no encontradas ni sin sesión.
      operationId: getGameToday
      security:
        - {}
        - playerCookie: []
      parameters:
        - $ref: '#/components/parameters/GameIdPath'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Desafío de hoy y partida del jugador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameToday' }
              examples:
                devdle:
                  value:
                    game_id: devdle
                    date: '2026-11-03'
                    number: 128
                    challenge_status: published
                    public_view: { length: 5, possible_categories: [programming_languages, git, databases, networking, linux, apis, security, software_engineering] }
                    play:
                      status: in_progress
                      state: { guesses: [ { guess: REACT, marks: [absent, present, absent, absent, absent] } ] }
                      score: null
                      code_language: null
                    result: null
                    game_stats: null
                timeline_en_curso:
                  summary: Tech Timeline en curso (`state` vacío hasta confirmar; los 5 ítems llegan mezclados y sin fechas)
                  value:
                    game_id: timeline
                    date: '2026-11-03'
                    number: 8
                    challenge_status: published
                    public_view:
                      prompt: 'Ordená estos hitos del más antiguo al más reciente'
                      items:
                        - { opaque_id: g2n5w3, label: Go, category: programming_languages }
                        - { opaque_id: k1v3s8, label: Kubernetes, category: software_tools }
                        - { opaque_id: p7k2m9, label: Python, category: programming_languages }
                        - { opaque_id: d9r6t0, label: Docker, category: software_tools }
                        - { opaque_id: j4x8q1, label: Java, category: programming_languages }
                    play:
                      status: in_progress
                      state: {}
                      score: null
                      code_language: null
                    result: null
                    game_stats: null
                big_o_en_curso:
                  summary: Big O en curso (`state` vacío hasta confirmar; el código llega en los 3 lenguajes y las 8 opciones en orden fijo)
                  value:
                    game_id: big-o
                    date: '2026-11-03'
                    number: 128
                    challenge_status: published
                    public_view:
                      code:
                        js: "function f(n) {\n  let ops = 0;\n  for (let i = 0; i < n; i++) {\n    for (let j = 1; j < n; j *= 2) {\n      ops++;\n    }\n  }\n  return ops;\n}"
                        go: "func f(n int) int {\n\tops := 0\n\tfor i := 0; i < n; i++ {\n\t\tfor j := 1; j < n; j *= 2 {\n\t\t\tops++\n\t\t}\n\t}\n\treturn ops\n}"
                        java: "static int f(int n) {\n    int ops = 0;\n    for (int i = 0; i < n; i++) {\n        for (int j = 1; j < n; j *= 2) {\n            ops++;\n        }\n    }\n    return ops;\n}"
                      options: [o_1, o_log_n, o_n, o_n_log_n, o_n2, o_n3, o_2n, o_n_fact]
                    play: { status: in_progress, state: {}, score: null, code_language: null }
                    result: null
                    game_stats: null
                    reported: false
                grep_grid_una_encontrada:
                  summary: Grep Grid en curso con 1 palabra encontrada (solo ella trae `definition`; la grilla y la lista están abreviadas)
                  value:
                    game_id: grep-grid
                    date: '2026-11-03'
                    number: 8
                    challenge_status: published
                    public_view:
                      grid:
                        - [X, Q, D, O, C, K, E, R, M, B, T, A]
                        - [L, R, E, D, I, S, P, W, Z, K, U, N]
                      words:
                        - { term_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7, word: DOCKER, definition: 'Plataforma para empaquetar y ejecutar aplicaciones en contenedores.' }
                        - { term_id: 3f2504e0-4f89-41d3-9a0c-0305e82c3301, word: REDIS }
                    play:
                      status: in_progress
                      state:
                        found_words:
                          - term_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                            cells: [ { row: 0, col: 2 }, { row: 0, col: 3 }, { row: 0, col: 4 }, { row: 0, col: 5 }, { row: 0, col: 6 }, { row: 0, col: 7 } ]
                        gave_up: false
                      score: null
                      code_language: null
                    result: null
                    game_stats: null
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/games/{game_id}/today/start:
    post:
      tags: [Gameplay]
      summary: Empezar la partida
      description: |
        F2, C-09. Crea la Play `in_progress` al salir de las instrucciones, con
        `state = initState(payload)`. Idempotente: `INSERT … ON CONFLICT (player_id, challenge_id) DO NOTHING`
        y devuelve la Play existente. Emite `PlayStarted`.

        Rate limit: 30 / min por `player_id`.
      operationId: startPlay
      security:
        - playerCookie: []
      parameters:
        - $ref: '#/components/parameters/GameIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeNumberBody' }
            example: { challenge_number: 128 }
      responses:
        '200':
          description: Play creada o existente
          content:
            application/json:
              schema:
                type: object
                required: [play]
                properties:
                  play: { $ref: '#/components/schemas/PlayView' }
              example:
                play: { status: in_progress, state: { guesses: [] }, score: null, code_language: null }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404':
          description: '`no_challenge_today` (sin desafío hoy) o `not_found` (juego sin paquete registrado)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/PlayConflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/games/{game_id}/today/move:
    post:
      tags: [Gameplay]
      summary: Hacer una jugada
      description: |
        F3, C-11, C-12, C-15, C-16, C-33. Valida `move` con `moveSchema` del juego y la aplica con
        `applyMove` en una transacción con `SELECT plays … FOR UPDATE` (si no existe la Play, la crea
        `in_progress` como `/start`).

        Si la jugada cierra la partida: `plays.status = won|lost`, `result`, `score`, `code_language`,
        `finished_at`; se actualizan `player_game_stats` y `player_stats` en la misma transacción (rachas con
        días neutros, ADR-011). `code_language = codeLanguage(state)` del juego (Big O y Bug Hunt; `null` en los demás) y, cuando no es null, se actualiza `players.preferred_code_language` en la misma transacción.

        Devdle: un intento fuera de la lista válida responde `422 not_in_word_list`, se registra en
        `rejected_guesses` y **no** consume intento.

        Grep Grid: una línea válida hacia adelante que no coincide exactamente con una de las 8 palabras
        (`not_a_word`) y una palabra ya encontrada (`already_found`) responden `200` con el `state` sin
        cambios y sin penalización. Una selección en reversa, no alineada, de una sola celda o fuera de
        0–11 responde `422 invalid_move`. `give_up` cierra la Play como `lost` con `score` = palabras
        encontradas (0–7) y `feedback: null`.

        Rate limit: 60 / min por `player_id` y 300 / min por IP.
      operationId: makeMove
      security:
        - playerCookie: []
      parameters:
        - $ref: '#/components/parameters/GameIdPath'
        - $ref: '#/components/parameters/Lang'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRequest' }
            examples:
              devdle:
                value: { challenge_number: 128, move: { guess: REACT } }
              grep_grid_select:
                value: { challenge_number: 128, move: { type: select, from: { row: 0, col: 2 }, to: { row: 0, col: 7 } } }
              grep_grid_give_up:
                value: { challenge_number: 128, move: { type: give_up } }
              timeline:
                value: { challenge_number: 128, move: { order: [p7k2m9, g2n5w3, j4x8q1, d9r6t0, k1v3s8] } }
              big_o:
                value: { challenge_number: 128, move: { language: go, option: o_n_log_n } }
              bug_hunt:
                value: { challenge_number: 128, move: { language: java, line: 7 } }
      responses:
        '200':
          description: Jugada aplicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResponse' }
              examples:
                devdle_en_curso:
                  value:
                    feedback: { guess: REDIS, marks: [correct, correct, absent, absent, absent] }
                    play:
                      status: in_progress
                      state: { guesses: [ { guess: REDIS, marks: [correct, correct, absent, absent, absent] } ] }
                      score: null
                    result: null
                    streaks: null
                    game_stats: null
                grep_grid_found:
                  value:
                    feedback:
                      found: true
                      term_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      word: DOCKER
                      definition: 'Plataforma para empaquetar y ejecutar aplicaciones en contenedores.'
                      cells: [ { row: 0, col: 2 }, { row: 0, col: 3 }, { row: 0, col: 4 }, { row: 0, col: 5 }, { row: 0, col: 6 }, { row: 0, col: 7 } ]
                    play:
                      status: in_progress
                      state:
                        found_words:
                          - term_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                            cells: [ { row: 0, col: 2 }, { row: 0, col: 3 }, { row: 0, col: 4 }, { row: 0, col: 5 }, { row: 0, col: 6 }, { row: 0, col: 7 } ]
                        gave_up: false
                      score: null
                    result: null
                    streaks: null
                    game_stats: null
                grep_grid_not_a_word:
                  summary: Línea válida que no es una de las 8 palabras; el estado no cambia
                  value:
                    feedback: { found: false, reason: not_a_word }
                    play: { status: in_progress, state: { found_words: [], gave_up: false }, score: null }
                    result: null
                    streaks: null
                    game_stats: null
                grep_grid_already_found:
                  summary: Palabra ya encontrada; se ignora sin error
                  value:
                    feedback: { found: false, reason: already_found }
                    play:
                      status: in_progress
                      state:
                        found_words:
                          - term_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                            cells: [ { row: 0, col: 2 }, { row: 0, col: 3 }, { row: 0, col: 4 }, { row: 0, col: 5 }, { row: 0, col: 6 }, { row: 0, col: 7 } ]
                        gave_up: false
                      score: null
                    result: null
                    streaks: null
                    game_stats: null
                grep_grid_give_up:
                  summary: Rendirse con 1/8 (la lista `words` del resultado está abreviada; trae las 8)
                  value:
                    feedback: null
                    play:
                      status: lost
                      state:
                        found_words:
                          - term_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                            cells: [ { row: 0, col: 2 }, { row: 0, col: 3 }, { row: 0, col: 4 }, { row: 0, col: 5 }, { row: 0, col: 6 }, { row: 0, col: 7 } ]
                        gave_up: true
                      score: 1
                    result:
                      win: false
                      score: 1
                      gave_up: true
                      words:
                        - term_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                          word: DOCKER
                          definition: 'Plataforma para empaquetar y ejecutar aplicaciones en contenedores.'
                          found: true
                          cells: [ { row: 0, col: 2 }, { row: 0, col: 3 }, { row: 0, col: 4 }, { row: 0, col: 5 }, { row: 0, col: 6 }, { row: 0, col: 7 } ]
                        - term_id: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
                          word: REDIS
                          definition: 'Base de datos en memoria de tipo clave-valor.'
                          found: false
                          cells: [ { row: 1, col: 1 }, { row: 1, col: 2 }, { row: 1, col: 3 }, { row: 1, col: 4 }, { row: 1, col: 5 } ]
                    streaks: { game: { current: 5, max: 9 }, global: { current: 6, max: 12 } }
                    game_stats:
                      game_id: grep-grid
                      current_streak: 5
                      max_streak: 9
                      played: 12
                      wins: 7
                      win_rate: 0.58
                      extra: { words_found: { '0': 0, '1': 1, '2': 0, '3': 1, '4': 0, '5': 1, '6': 1, '7': 1, '8': 7 } }
                timeline_cierre_3_de_5:
                  summary: Confirmar un orden con 3/5 posiciones correctas (cierra la Play como `lost`)
                  value:
                    feedback: null
                    play:
                      status: lost
                      state: { order: [p7k2m9, g2n5w3, j4x8q1, d9r6t0, k1v3s8] }
                      score: 3
                    result:
                      win: false
                      score: 3
                      correct_order: [p7k2m9, j4x8q1, g2n5w3, d9r6t0, k1v3s8]
                      submitted_order: [p7k2m9, g2n5w3, j4x8q1, d9r6t0, k1v3s8]
                      items:
                        - { opaque_id: p7k2m9, label: Python, category: programming_languages, event_date: '1991-02-20', date_precision: day, note: 'Guido van Rossum publica la primera versión.' }
                        - { opaque_id: j4x8q1, label: Java, category: programming_languages, event_date: '1995-05-23', date_precision: day, note: 'Sun Microsystems presenta Java.' }
                        - { opaque_id: g2n5w3, label: Go, category: programming_languages, event_date: '2009-01-01', date_precision: year, note: 'Google hace público el lenguaje Go.' }
                        - { opaque_id: d9r6t0, label: Docker, category: software_tools, event_date: '2013-03-20', date_precision: day, note: 'Docker se presenta al público.' }
                        - { opaque_id: k1v3s8, label: Kubernetes, category: software_tools, event_date: '2014-06-01', date_precision: month, note: 'Google libera Kubernetes como código abierto.' }
                    streaks: { game: { current: 1, max: 1 }, global: { current: 1, max: 1 } }
                    game_stats:
                      game_id: timeline
                      current_streak: 1
                      max_streak: 1
                      played: 1
                      wins: 0
                      win_rate: 0
                      extra: { by_category: { programming_languages: { played: 3, correct: 1 }, software_tools: { played: 2, correct: 2 } } }
                big_o_cierre:
                  value:
                    feedback: null
                    play: { status: won, state: { language: go, option: o_n_log_n }, score: 1, code_language: go }
                    result:
                      win: true
                      score: 1
                      answer: o_n_log_n
                      chosen_option: o_n_log_n
                      code_language: go
                      recipe_category: nested_loops
                      trap_option: o_n2
                      explanation:
                        steps:
                          - 'El loop externo corre n veces.'
                          - 'El interno duplica j: log2 n vueltas.'
                          - 'Anidados se multiplican: n x log n. Simplificado: O(n log n).'
                        line_notes: [ { line: 3, text: 'n veces' }, { line: 4, text: 'log n veces' } ]
                        tip: 'Un loop interno que duplica su variable no es n.'
                        example: { n: 1024, ops: 10240, trap_ops: 1048576 }
                    streaks: { game: { current: 4, max: 9 }, global: { current: 6, max: 12 } }
                    game_stats:
                      game_id: big-o
                      current_streak: 4
                      max_streak: 9
                      played: 12
                      wins: 8
                      win_rate: 0.67
                      extra: { by_category: { nested_loops: { played: 7, correct: 5 }, recursion: { played: 5, correct: 3 } } }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404':
          description: '`no_challenge_today` (sin desafío hoy) o `not_found` (juego sin paquete registrado)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/PlayConflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: |
            `invalid_move` (no pasa `moveSchema` o es inválida para el estado: selección en reversa, no
            alineada o de una sola celda en Grep Grid, faltantes/duplicados en Timeline, `line` ∉ `pickable_lines` en Bug Hunt) o
            `not_in_word_list` (Devdle; no consume intento).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid_move:
                  summary: Jugada inválida (por ejemplo faltantes, duplicados o ids ajenos en Timeline)
                  value: { error: { code: invalid_move, message: 'Jugada inválida.' } }
                not_in_word_list:
                  value: { error: { code: not_in_word_list, message: 'La palabra no está en la lista' } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/games/{game_id}/today/acknowledge-void:
    post:
      tags: [Gameplay]
      summary: Marcar como completado un desafío anulado de hoy
      description: |
        F6, C-42. Para un jugador sin Play en el desafío anulado de hoy: crea una Play `voided`
        (`finished_at = now()`), `ON CONFLICT DO NOTHING`, y actualiza rachas y `total_completed`.
        Es idempotente: con Play existente devuelve `play: { status: voided }` y las rachas vivas sin volver a sumar.

        Rate limit: 30 / min por `player_id`.
      operationId: acknowledgeVoid
      security:
        - playerCookie: []
      parameters:
        - $ref: '#/components/parameters/GameIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeNumberBody' }
            example: { challenge_number: 128 }
      responses:
        '200':
          description: Play anulada creada (o existente) y rachas actualizadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgeVoidResponse' }
              example:
                play: { status: voided }
                streaks: { game: { current: 4, max: 9 }, global: { current: 6, max: 12 } }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NoChallengeToday' }
        '409':
          description: '`challenge_expired` o `not_voided` (el desafío de hoy no está anulado)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: not_voided, message: 'Este desafío no está anulado' } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────────── Reports ─────────────────────────────
  /api/games/{game_id}/today/report:
    post:
      tags: [Reports]
      summary: Reportar un problema con un desafío publicado o anulado
      description: |
        F5, C-36, C-37. Solo sobre un desafío `published` o `voided` de ese juego, de hoy o de un día pasado,
        identificado por `challenge_number`. `context` lo arma el servidor (`code_language`, `play_status`,
        `play_state`, `user_agent`) y `locale`. Uno por jugador y desafío.

        Si se alcanza el umbral (`REPORT_ALERT_COUNT` = 3, o `REPORT_ALERT_RATIO_MIN_COUNT` = 2 y
        > `REPORT_ALERT_RATIO` = 5% de las Play terminadas, contando solo `wrong_answer`/`ambiguous`) y
        `challenges.alerted_at IS NULL`, se marca `alerted_at = now()` en la misma transacción, una sola
        vez por desafío (ADR-017). No se envía ningún mail: el admin lo muestra en Reportes.

        Rate limit: 10 / hora por IP.
      operationId: reportChallenge
      security:
        - playerCookie: []
      parameters:
        - $ref: '#/components/parameters/GameIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
            example: { challenge_number: 128, reason: wrong_answer, message: 'La línea 7 no tiene el bug', code_language: go }
      responses:
        '201':
          description: Reporte creado
          content:
            application/json:
              schema:
                type: object
                required: [report_id]
                properties:
                  report_id: { type: string, format: uuid }
              example: { report_id: 3f6c1d2e-8a4b-4c1f-9e2a-7b5d0c9e1a23 }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`already_reported`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: already_reported, message: 'Ya reportaste este desafío' } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: '`invalid_report` (`reason` inválido o `message` > 1000 caracteres)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: invalid_report, message: 'El comentario supera los 1000 caracteres' } }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────────── Stats ─────────────────────────────
  /api/me/stats:
    get:
      tags: [Stats]
      summary: Estadísticas del jugador
      description: |
        F12, C-34. Rachas vivas (ADR-011), stats por juego, heatmap de los últimos 365 días e historial
        paginado de a 60 entradas, del más reciente al más antiguo. Las Play `voided` no entran en
        `played`, `wins` ni `extra`.
      operationId: getMyStats
      security:
        - playerCookie: []
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: history_before
          in: query
          required: false
          description: Devuelve historial con `date` estrictamente anterior a esta fecha (paginación)
          schema: { type: string, format: date }
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyStats' }
        '401': { $ref: '#/components/responses/NoSession' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────────── Admin ─────────────────────────────
  /api/admin/login:
    post:
      tags: [Admin]
      summary: Login del admin
      description: |
        C-38, ADR-010. Compara `password` contra `ADMIN_PASSWORD_HASH` (scrypt, tiempo constante) y emite
        un JWT HS256 de 8 h (`sub: "admin"`). Rate limit: 5 / 15 min por IP.
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLoginResponse' }
              example: { token: eyJhbGciOiJIUzI1NiJ9..., expires_at: '2026-11-03T20:00:00Z' }
        '401':
          description: Contraseña incorrecta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: invalid_credentials, message: 'Contraseña incorrecta' } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/admin/reports:
    get:
      tags: [Admin]
      summary: Reportes agrupados por desafío
      description: |
        F11, C-39. Primero los grupos con `alerted_at` (alcanzaron el umbral, ADR-017), después por
        `report_count` desc. El `payload` incluye la solución y ambos idiomas.
      operationId: listReportGroups
      security:
        - adminBearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            allOf: [ { $ref: '#/components/schemas/ReportStatus' } ]
            default: open
      responses:
        '200':
          description: Reportes agrupados
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: '#/components/schemas/ReportGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/admin/reports/{report_id}:
    patch:
      tags: [Admin]
      summary: Resolver o descartar un reporte
      description: F11, C-40. Solo desde `open`. Emite `ReportResolved` / `ReportDismissed`.
      operationId: updateReportStatus
      security:
        - adminBearer: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [resolved, dismissed] }
      responses:
        '200':
          description: Reporte actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`report_not_open` (el reporte ya fue resuelto o descartado)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: report_not_open, message: 'El reporte ya fue procesado' } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/admin/challenges/{challenge_id}/void:
    post:
      tags: [Admin]
      summary: Anular un desafío
      description: |
        F6, C-41. En una transacción:
        1. `challenges.status = voided`, `void_reason`, `voided_at = now()`.
        2. Todas sus Play pasan a `voided` (conservan `result`; `finished_at = coalesce(finished_at, now())`).
        3. Sus reportes `open` pasan a `resolved`.
        4. El ítem culpable (`term` / `timeline_fact`) pasa a `rejected` con `rejection_reason`.
        5. Se recalculan `player_game_stats` y `player_stats` de los jugadores afectados (ADR-011).

        Después invalida la cache de desafíos de hoy.
      operationId: voidChallenge
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidRequest' }
            example:
              void_reason: 'La respuesta correcta era O(n), no O(n log n)'
              culprit: { kind: template }
      responses:
        '200':
          description: Desafío anulado
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, affected_plays]
                properties:
                  challenge_id: { type: string, format: uuid }
                  affected_plays: { type: integer, minimum: 0 }
              example: { challenge_id: 6a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d, affected_plays: 214 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`not_voidable` (el desafío no está `published`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: not_voidable, message: 'Solo se puede anular un desafío publicado' } }
        '422':
          description: '`validation_error` (body inválido) o `invalid_culprit` (el culpable no pertenece al desafío)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/challenges/upcoming:
    get:
      tags: [Admin]
      summary: Próximos desafíos
      description: |
        F11, C-43. Para cada día de `today+1` a `today+days`, el desafío vigente de cada juego
        (`approved`) con `payload` completo, log de verificación, `attempt` e ítems de banco rechazados
        (`rejected_items`), y el último pedido de regeneración si está `pending` o `failed` (`regeneration`).
        Si no hay desafío y el generator registró una falla (`generation_failures`), la incluye
        en `failure` (ADR-017). `active_failures` cuenta las fallas activas. El admin hace polling cada 5 s
        mientras haya `regeneration.status = pending`. Nunca incluye hoy ni el pasado (REQ-008).
      operationId: listUpcomingChallenges
      security:
        - adminBearer: []
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 14, default: 14 }
      responses:
        '200':
          description: Próximos días
          content:
            application/json:
              schema:
                type: object
                required: [days, active_failures]
                properties:
                  days:
                    type: array
                    items: { $ref: '#/components/schemas/UpcomingDay' }
                  active_failures:
                    type: integer
                    description: Fallas de generación activas (fecha en la ventana y sin challenge vigente)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/admin/challenges/{challenge_id}/regenerate:
    post:
      tags: [Admin]
      summary: Pedir la regeneración de un desafío aprobado
      description: |
        F8, C-44, ADR-005. Inserta en `generation_requests` (`status = pending`) y ejecuta
        `pg_notify('generation_requests', request_id)`. Si ya hay uno pendiente para ese challenge, devuelve
        ese (idempotente, `INSERT ... ON CONFLICT DO NOTHING`). El viejo sigue `approved` hasta que el
        `generator` verifique el nuevo. Si la fecha llega antes, el `generator` cancela el pedido.
      operationId: regenerateChallenge
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPath'
      responses:
        '202':
          description: Pedido encolado (nuevo o existente)
          content:
            application/json:
              schema:
                type: object
                required: [request_id, status, requested_at]
                properties:
                  request_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending] }
                  requested_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`not_regenerable` (`status ≠ approved` o `date <= today`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: not_regenerable, message: 'Solo se puede regenerar un desafío aprobado de una fecha futura' } }

  /api/admin/generation-failures:
    get:
      tags: [Admin]
      summary: Fallas de generación activas
      description: |
        ADR-017, C-49 (REQ-008). Fallas activas: `date` en `[today+1, today+14]` y sin challenge vigente para
        ese (`game_id`, `date`). Liviano, sin `payload`: lo usa el shell del admin para el contador "Próximos (n)".
      operationId: listGenerationFailures
      security:
        - adminBearer: []
      responses:
        '200':
          description: Fallas activas, ordenadas por fecha y juego
          content:
            application/json:
              schema:
                type: object
                required: [failures]
                properties:
                  failures:
                    type: array
                    items:
                      type: object
                      required: [game_id, date, attempts, last_reason, updated_at]
                      properties:
                        game_id: { $ref: '#/components/schemas/GameId' }
                        date: { type: string, format: date }
                        attempts: { type: integer, minimum: 1 }
                        last_reason: { type: string, nullable: true }
                        updated_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/content/stock:
    get:
      tags: [Admin]
      summary: Stock de los bancos de contenido
      description: |
        F11, C-45, ADR-016. Stock por banco, ítems rechazados con su motivo, última carga del dataset
        (`job_runs` con `job = 'sync_banks'`) y las 50 palabras más rechazadas en Devdle
        (`rejected_guesses` agrupadas por cantidad de jugadores distintos).
      operationId: getContentStock
      security:
        - adminBearer: []
      responses:
        '200':
          description: Stock por banco
          content:
            application/json:
              schema:
                type: object
                required: [banks, last_sync, top_rejected_guesses]
                properties:
                  banks:
                    type: array
                    items: { $ref: '#/components/schemas/BankStock' }
                  last_sync:
                    type: object
                    nullable: true
                    description: Última corrida de `sync_banks`; null si nunca corrió
                    required: [finished_at, dataset_version, inserted, updated, unchanged, kept_rejected]
                    properties:
                      finished_at: { type: string, format: date-time }
                      dataset_version: { type: string, example: '2026.11.03' }
                      inserted: { type: integer }
                      updated: { type: integer }
                      unchanged: { type: integer }
                      kept_rejected: { type: integer }
                  top_rejected_guesses:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [word, distinct_players]
                      properties:
                        word: { type: string, pattern: '^[A-Z]+$' }
                        distinct_players: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/metrics:
    get:
      tags: [Admin]
      summary: Métricas de uso, retención y calidad
      description: F11, C-46, ADR-014. Lee las vistas `metrics_*` en el rango `[from, to]`.
      operationId: getMetrics
      security:
        - adminBearer: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Métricas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Metrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    playerCookie:
      type: apiKey
      in: cookie
      name: nd_pid
      description: |
        Cookie funcional del jugador anónimo (ADR-009). Valor = `players.id` (UUID v4).
        `HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=34560000`, sin `Domain`. Se emite en `POST /api/session`.
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT HS256 de 8 h obtenido en `POST /api/admin/login` (ADR-010). Claims `{ sub: "admin", iat, exp }`.

  parameters:
    GameIdPath:
      name: game_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/GameId' }
    ChallengeIdPath:
      name: challenge_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Lang:
      name: lang
      in: query
      required: false
      description: Fuerza el locale de la respuesta. Si falta, `players.locale` → `Accept-Language` → `es`.
      schema: { $ref: '#/components/schemas/Locale' }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string }

  responses:
    NoSession:
      description: Falta la cookie `nd_pid` o no corresponde a un Player
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: no_session, message: 'Activá las cookies para jugar' } }
    Unauthorized:
      description: Falta el JWT de admin, es inválido o venció
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unauthorized, message: 'Sesión vencida' } }
    ForbiddenOrigin:
      description: Mutación con header `Origin` no permitido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: forbidden_origin, message: 'Origen no permitido' } }
    UnsupportedMediaType:
      description: Mutación sin `Content-Type application/json`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unsupported_media_type, message: 'Se espera application/json' } }
    NotFound:
      description: Recurso inexistente (`game_id`, `challenge_id`, `report_id`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: not_found, message: 'No encontrado' } }
    NoChallengeToday:
      description: No hay desafío de hoy `published` ni `voided` para ese juego
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: no_challenge_today, message: 'Hoy no hay desafío para este juego' } }
    PlayConflict:
      description: |
        `challenge_expired` (`challenge_number` ≠ número de hoy), `challenge_voided` (desafío anulado) o
        `game_finished` (la Play no está `in_progress`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            challenge_expired:
              value: { error: { code: challenge_expired, message: 'El desafío cambió. Cargando el de hoy…' } }
            challenge_voided:
              value: { error: { code: challenge_voided, message: 'Este desafío fue anulado' } }
            game_finished:
              value: { error: { code: game_finished, message: 'La partida ya terminó' } }
    ValidationError:
      description: Body, query o params inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: validation_error, message: 'Datos inválidos' } }
    RateLimited:
      description: Límite de requests superado (ADR-012)
      headers:
        Retry-After:
          description: Segundos a esperar
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: rate_limited, message: 'Demasiadas solicitudes. Probá de nuevo en un rato' } }

  schemas:
    # ─────────── Enums ───────────
    GameId:
      type: string
      enum: [devdle, bug-hunt, big-o, timeline, grep-grid]
    Locale:
      type: string
      enum: [es, en]
    CodeLanguage:
      type: string
      enum: [js, go, java]
    ChallengeStatus:
      type: string
      enum: [draft, approved, published, rejected, voided]
    PublicChallengeStatus:
      type: string
      description: Estado del desafío de hoy visto por el jugador. `none` = no hay desafío publicado.
      enum: [published, voided, none]
    PlayStatus:
      type: string
      enum: [in_progress, won, lost, voided]
    ReportReason:
      type: string
      enum: [wrong_answer, ambiguous, wrong_explanation, translation, display_bug, other]
    ReportStatus:
      type: string
      enum: [open, resolved, dismissed]
    BigOOption:
      type: string
      enum: [o_1, o_log_n, o_n, o_n_log_n, o_n2, o_n3, o_2n, o_n_fact]
    RecipeCategory:
      type: string
      description: Conjunto inicial; se amplía con el catálogo de bloques
      enum: [simple_loops, nested_loops, recursion, divide_and_conquer, binary_search]
    BugType:
      type: string
      enum: [off_by_one, comparison, wrong_operator, wrong_variable, bad_initialization, misplaced_return, inverted_condition]
    TermCategory:
      type: string
      enum: [programming_languages, git, databases, networking, linux, apis, security, software_engineering]
    TimelineCategory:
      type: string
      enum: [programming_languages, frameworks, companies, operating_systems, hardware, video_games, databases, software_tools]
    DatePrecision:
      type: string
      enum: [year, month, day]
    LetterMark:
      type: string
      enum: [correct, present, absent]

    # ─────────── Comunes ───────────
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código del catálogo de ADR-015
              enum:
                - no_session
                - unauthorized
                - invalid_credentials
                - forbidden_origin
                - no_challenge_today
                - not_found
                - challenge_expired
                - challenge_voided
                - game_finished
                - already_reported
                - not_voidable
                - not_regenerable
                - not_voided
                - report_not_open
                - unsupported_media_type
                - invalid_move
                - not_in_word_list
                - invalid_report
                - invalid_culprit
                - validation_error
                - rate_limited
                - internal_error
            message:
              type: string
              description: Texto en el locale resuelto de la request

    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: string, enum: [ok, error] }

    Streak:
      type: object
      required: [current, max]
      properties:
        current: { type: integer, minimum: 0 }
        max: { type: integer, minimum: 0 }

    Streaks:
      type: object
      required: [game, global]
      properties:
        game: { $ref: '#/components/schemas/Streak' }
        global: { $ref: '#/components/schemas/Streak' }

    Cell:
      type: object
      required: [row, col]
      properties:
        row: { type: integer, minimum: 0, maximum: 11 }
        col: { type: integer, minimum: 0, maximum: 11 }

    CodeByLanguage:
      type: object
      required: [js, go, java]
      properties:
        js: { type: string }
        go: { type: string }
        java: { type: string }

    LocalizedText:
      type: object
      description: Texto bilingüe. Solo aparece en respuestas de admin (dentro de `payload`).
      required: [es, en]
      properties:
        es: { type: string }
        en: { type: string }

    ChallengeNumberBody:
      type: object
      required: [challenge_number]
      properties:
        challenge_number:
          type: integer
          minimum: 1
          description: Número del desafío que el cliente cree que es hoy. Si no coincide → `409 challenge_expired`.

    # ─────────── Session ───────────
    Preferences:
      type: object
      required: [locale, preferred_code_language]
      properties:
        locale: { $ref: '#/components/schemas/Locale' }
        preferred_code_language: { $ref: '#/components/schemas/CodeLanguage' }

    SessionResponse:
      allOf:
        - $ref: '#/components/schemas/Preferences'
        - type: object
          required: [created]
          properties:
            created:
              type: boolean
              description: true si se creó un Player nuevo

    PreferencesUpdate:
      type: object
      minProperties: 1
      properties:
        locale: { $ref: '#/components/schemas/Locale' }
        preferred_code_language: { $ref: '#/components/schemas/CodeLanguage' }

    # ─────────── Today ───────────
    TodayGame:
      type: object
      required: [game_id, challenge_status, play_status, history_label, current_streak]
      properties:
        game_id: { $ref: '#/components/schemas/GameId' }
        challenge_status: { $ref: '#/components/schemas/PublicChallengeStatus' }
        play_status:
          allOf: [ { $ref: '#/components/schemas/PlayStatus' } ]
          nullable: true
          description: null si no hay sesión o no hay Play
        history_label:
          type: string
          nullable: true
          description: '`historyLabel(result)` si la Play terminó, por ejemplo "✓ 4/6"'
        current_streak:
          type: integer
          minimum: 0
          description: Racha viva del juego (0 si no está viva)

    Today:
      type: object
      required: [date, number, next_reset_at, seconds_to_reset, has_session, global_streak, completed_today, games]
      properties:
        date: { type: string, format: date, description: Día UTC de la plataforma }
        number: { type: integer, minimum: 1, nullable: true, description: 'today − LAUNCH_DATE + 1; null antes del lanzamiento' }
        next_reset_at: { type: string, format: date-time }
        seconds_to_reset: { type: integer, minimum: 0 }
        has_session: { type: boolean }
        global_streak: { $ref: '#/components/schemas/Streak' }
        completed_today:
          type: integer
          minimum: 0
          description: Play de hoy completadas (`won`, `lost`, `voided`)
        games:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/TodayGame' }

    # ─────────── Vistas públicas (sin solución) ───────────
    DevdlePublicView:
      type: object
      required: [length, possible_categories]
      properties:
        length: { type: integer, minimum: 4, maximum: 12 }
        possible_categories:
          type: array
          items: { $ref: '#/components/schemas/TermCategory' }

    GrepGridPublicView:
      type: object
      required: [grid, words]
      properties:
        grid:
          type: array
          description: 12 filas de 12 letras (A–Z)
          minItems: 12
          maxItems: 12
          items:
            type: array
            minItems: 12
            maxItems: 12
            items: { type: string, minLength: 1, maxLength: 1 }
        words:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: object
            required: [term_id, word]
            properties:
              term_id: { type: string, format: uuid }
              word: { type: string }
              definition:
                type: string
                description: |
                  Opcional. Solo en las palabras ya encontradas por la Play `in_progress` del jugador, en
                  el locale resuelto. Nunca en las no encontradas ni sin sesión (anti-spoiler, ADR-006).

    TimelinePublicView:
      type: object
      description: |
        El desafío mezcla hechos de todas las categorías: no tiene categoría propia. `prompt` es la consigna
        única y fija en el locale resuelto. Cada item trae la categoría de su hecho, que no revela la fecha.
      required: [prompt, items]
      properties:
        prompt: { type: string }
        items:
          type: array
          description: Mezclados; `opaque_id` aleatorio por desafío
          minItems: 5
          maxItems: 5
          items:
            type: object
            required: [opaque_id, label, category]
            properties:
              opaque_id: { type: string }
              label: { type: string }
              category: { $ref: '#/components/schemas/TimelineCategory' }

    BigOPublicView:
      type: object
      required: [code, options]
      properties:
        code: { $ref: '#/components/schemas/CodeByLanguage' }
        options:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: '#/components/schemas/BigOOption' }

    BugHuntPublicView:
      type: object
      required: [spec, code, pickable_lines, visible_tests]
      properties:
        spec: { type: string }
        code: { $ref: '#/components/schemas/CodeByLanguage' }
        pickable_lines:
          type: array
          description: Números de línea elegibles (1-based); iguales en los 3 lenguajes
          items: { type: integer, minimum: 1 }
        visible_tests:
          type: array
          items: { $ref: '#/components/schemas/TestCase' }

    TestCase:
      type: object
      required: [input, expected]
      properties:
        input: { description: Argumentos del test (JSON) }
        expected: { description: Resultado esperado (JSON) }

    PublicView:
      description: '`toPublic(payload)` del juego, en el locale resuelto. Nunca incluye la solución.'
      oneOf:
        - $ref: '#/components/schemas/DevdlePublicView'
        - $ref: '#/components/schemas/GrepGridPublicView'
        - $ref: '#/components/schemas/TimelinePublicView'
        - $ref: '#/components/schemas/BigOPublicView'
        - $ref: '#/components/schemas/BugHuntPublicView'

    # ─────────── Estado de partida ───────────
    DevdleGuess:
      type: object
      required: [guess, marks]
      properties:
        guess: { type: string, pattern: '^[A-Z]{4,12}$' }
        marks:
          type: array
          items: { $ref: '#/components/schemas/LetterMark' }

    DevdleState:
      type: object
      required: [guesses]
      properties:
        guesses:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/DevdleGuess' }

    GrepGridState:
      type: object
      required: [found_words, gave_up]
      properties:
        gave_up:
          type: boolean
          description: '`true` si el jugador se rindió. La partida termina con `gave_up` o con 8 palabras encontradas'
        found_words:
          type: array
          description: Palabras encontradas, en el orden en que se encontraron
          maxItems: 8
          items:
            type: object
            required: [term_id, cells]
            properties:
              term_id: { type: string, format: uuid }
              cells:
                type: array
                items: { $ref: '#/components/schemas/Cell' }

    EmptyState:
      type: object
      description: Bug Hunt (una sola confirmación) no tiene estado intermedio
      additionalProperties: false

    TimelineState:
      type: object
      description: Vacío mientras la Play está in_progress; guarda el orden confirmado al cerrar
      additionalProperties: false
      properties:
        order:
          type: array
          minItems: 5
          maxItems: 5
          items: { type: string }

    BigOState:
      type: object
      description: Vacío mientras la Play está in_progress; guarda el lenguaje y la opción confirmados al cerrar
      additionalProperties: false
      properties:
        language: { $ref: '#/components/schemas/CodeLanguage' }
        option: { $ref: '#/components/schemas/BigOOption' }

    PlayState:
      oneOf:
        - $ref: '#/components/schemas/DevdleState'
        - $ref: '#/components/schemas/GrepGridState'
        - $ref: '#/components/schemas/TimelineState'
        - $ref: '#/components/schemas/BigOState'
        - $ref: '#/components/schemas/EmptyState'

    PlayView:
      type: object
      required: [status, state, score, code_language]
      properties:
        status: { $ref: '#/components/schemas/PlayStatus' }
        state: { $ref: '#/components/schemas/PlayState' }
        score:
          type: integer
          nullable: true
          description: 'devdle: intentos usados (1–6); grep-grid: 0–8; timeline: 0–5; big-o / bug-hunt: 1 o 0'
        code_language:
          allOf: [ { $ref: '#/components/schemas/CodeLanguage' } ]
          nullable: true
          description: Solo big-o y bug-hunt, el lenguaje con el que confirmó

    # ─────────── Jugadas ───────────
    DevdleMove:
      type: object
      required: [guess]
      properties:
        guess:
          type: string
          pattern: '^[A-Z]{4,12}$'
          description: En mayúsculas; largo = `public_view.length`

    GrepGridSelectMove:
      type: object
      required: [type, from, to]
      properties:
        type: { type: string, enum: [select] }
        from: { $ref: '#/components/schemas/Cell' }
        to: { $ref: '#/components/schemas/Cell' }

    GrepGridGiveUpMove:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [give_up] }

    TimelineMove:
      type: object
      required: [order]
      properties:
        order:
          type: array
          description: Los 5 `opaque_id`, del más antiguo al más reciente, sin faltantes ni duplicados
          minItems: 5
          maxItems: 5
          uniqueItems: true
          items: { type: string }

    BigOMove:
      type: object
      required: [language, option]
      properties:
        language: { $ref: '#/components/schemas/CodeLanguage' }
        option: { $ref: '#/components/schemas/BigOOption' }

    BugHuntMove:
      type: object
      required: [language, line]
      properties:
        language: { $ref: '#/components/schemas/CodeLanguage' }
        line:
          type: integer
          minimum: 1
          description: Debe pertenecer a `pickable_lines`

    Move:
      description: '`Move` del juego; se valida con `moveSchema` de su GameDefinition'
      oneOf:
        - $ref: '#/components/schemas/DevdleMove'
        - $ref: '#/components/schemas/GrepGridSelectMove'
        - $ref: '#/components/schemas/GrepGridGiveUpMove'
        - $ref: '#/components/schemas/TimelineMove'
        - $ref: '#/components/schemas/BigOMove'
        - $ref: '#/components/schemas/BugHuntMove'

    MoveRequest:
      type: object
      required: [challenge_number, move]
      properties:
        challenge_number: { type: integer, minimum: 1 }
        move: { $ref: '#/components/schemas/Move' }

    # ─────────── Feedback ───────────
    DevdleFeedback:
      $ref: '#/components/schemas/DevdleGuess'

    GrepGridFeedbackFound:
      type: object
      required: [found, term_id, word, definition, cells]
      properties:
        found: { type: boolean, enum: [true] }
        term_id: { type: string, format: uuid }
        word: { type: string }
        definition: { type: string }
        cells:
          type: array
          items: { $ref: '#/components/schemas/Cell' }

    GrepGridFeedbackNotFound:
      type: object
      required: [found, reason]
      properties:
        found: { type: boolean, enum: [false] }
        reason: { type: string, enum: [not_a_word, already_found] }

    Feedback:
      description: |
        Feedback de una jugada en curso. `null` en Timeline, Big O y Bug Hunt (la jugada cierra) y en
        Grep Grid `give_up`.
      nullable: true
      oneOf:
        - $ref: '#/components/schemas/DevdleFeedback'
        - $ref: '#/components/schemas/GrepGridFeedbackFound'
        - $ref: '#/components/schemas/GrepGridFeedbackNotFound'

    # ─────────── Resultados (post-partida, en el locale) ───────────
    DevdleResult:
      type: object
      required: [win, score, word, category, definition, summary, guesses]
      properties:
        win: { type: boolean }
        score: { type: integer, minimum: 1, maximum: 6 }
        word: { type: string }
        category: { $ref: '#/components/schemas/TermCategory' }
        definition: { type: string }
        summary: { type: string }
        guesses:
          type: array
          items: { $ref: '#/components/schemas/DevdleGuess' }

    GrepGridResult:
      type: object
      required: [win, score, gave_up, words]
      properties:
        win: { type: boolean }
        score: { type: integer, minimum: 0, maximum: 8 }
        gave_up: { type: boolean }
        words:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: object
            required: [term_id, word, definition, found, cells]
            properties:
              term_id: { type: string, format: uuid }
              word: { type: string }
              definition: { type: string }
              found: { type: boolean }
              cells:
                type: array
                items: { $ref: '#/components/schemas/Cell' }

    TimelineResult:
      type: object
      required: [win, score, correct_order, submitted_order, items]
      properties:
        win: { type: boolean }
        score: { type: integer, minimum: 0, maximum: 5 }
        correct_order:
          type: array
          items: { type: string }
        submitted_order:
          type: array
          items: { type: string }
        items:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            required: [opaque_id, label, category, event_date, date_precision, note]
            properties:
              opaque_id: { type: string }
              label: { type: string }
              category: { $ref: '#/components/schemas/TimelineCategory' }
              event_date: { type: string, format: date }
              date_precision: { $ref: '#/components/schemas/DatePrecision' }
              note: { type: string }

    BigOResult:
      type: object
      required: [win, score, answer, chosen_option, code_language, recipe_category, trap_option, explanation]
      properties:
        win: { type: boolean }
        score: { type: integer, enum: [0, 1] }
        answer: { $ref: '#/components/schemas/BigOOption' }
        chosen_option: { $ref: '#/components/schemas/BigOOption' }
        code_language: { $ref: '#/components/schemas/CodeLanguage' }
        recipe_category: { $ref: '#/components/schemas/RecipeCategory' }
        trap_option:
          allOf: [ { $ref: '#/components/schemas/BigOOption' } ]
          nullable: true
          description: Respuesta equivocada típica de la receta (recuadro "en números"); null si no hay trampa
        explanation: { $ref: '#/components/schemas/BigOExplanation' }

    BigOExplanation:
      type: object
      description: Explicación paso a paso en el locale resuelto
      required: [steps, line_notes, tip, example]
      properties:
        steps:
          type: array
          minItems: 2
          maxItems: 6
          items: { type: string }
          description: Costo de cada bloque, reglas de anidamiento y secuencia, simplificación final
        line_notes:
          type: array
          items:
            type: object
            required: [line, text]
            properties:
              line: { type: integer, minimum: 1, description: Línea (1-based), igual en los 3 lenguajes }
              text: { type: string }
        tip: { type: string, nullable: true }
        example:
          type: object
          nullable: true
          required: [n, ops, trap_ops]
          properties:
            n: { type: integer, minimum: 1 }
            ops: { type: integer, minimum: 1, description: Operaciones de f(n) en ese n (comprobado por ejecución) }
            trap_ops: { type: integer, nullable: true, description: Lo que daría trap_option en ese n }

    BugHuntResult:
      type: object
      required: [win, score, chosen_line, code_language, bug_line, bug_type, failing_test, fix, explanation]
      properties:
        win: { type: boolean }
        score: { type: integer, enum: [0, 1] }
        chosen_line: { type: integer, minimum: 1 }
        code_language: { $ref: '#/components/schemas/CodeLanguage' }
        bug_line:
          type: integer
          minimum: 1
          description: Línea del bug (igual en los 3 lenguajes, una sentencia por línea)
        bug_type: { $ref: '#/components/schemas/BugType' }
        failing_test:
          type: object
          required: [input, expected, actual]
          properties:
            input: { description: Argumentos (JSON) }
            expected: { description: Resultado esperado (JSON) }
            actual: { description: Resultado de la versión con bug (JSON) }
        fix:
          type: object
          description: Diff unificado del fix, por lenguaje
          required: [js, go, java]
          properties:
            js: { type: string }
            go: { type: string }
            java: { type: string }
        explanation: { type: string }

    Result:
      description: '`result(payload, state)` del juego en el locale. Solo cuando la Play terminó.'
      nullable: true
      oneOf:
        - $ref: '#/components/schemas/DevdleResult'
        - $ref: '#/components/schemas/GrepGridResult'
        - $ref: '#/components/schemas/TimelineResult'
        - $ref: '#/components/schemas/BigOResult'
        - $ref: '#/components/schemas/BugHuntResult'

    # ─────────── Gameplay: responses ───────────
    GameToday:
      type: object
      required: [game_id, date, number, challenge_status, public_view, play, result, game_stats, reported]
      properties:
        game_id: { $ref: '#/components/schemas/GameId' }
        date: { type: string, format: date }
        number:
          type: integer
          minimum: 1
          nullable: true
          description: null antes de `LAUNCH_DATE` (`challenge_status` es `none`)
        challenge_status: { $ref: '#/components/schemas/PublicChallengeStatus' }
        public_view:
          allOf: [ { $ref: '#/components/schemas/PublicView' } ]
          nullable: true
          description: null si `challenge_status` es `none` o `voided`
        play:
          allOf: [ { $ref: '#/components/schemas/PlayView' } ]
          nullable: true
          description: 'Con `challenge_status: voided` viene la Play del jugador si existe (`status: voided`)'
        result:
          allOf: [ { $ref: '#/components/schemas/Result' } ]
          nullable: true
        game_stats:
          allOf: [ { $ref: '#/components/schemas/GameStatsView' } ]
          nullable: true
          description: Si la Play terminó o está `voided`
        reported:
          type: boolean
          description: El jugador ya reportó este desafío; false sin sesión

    MoveResponse:
      type: object
      required: [feedback, play, result, streaks, game_stats]
      properties:
        feedback: { $ref: '#/components/schemas/Feedback' }
        play:
          type: object
          required: [status, state, score, code_language]
          properties:
            status: { $ref: '#/components/schemas/PlayStatus' }
            state: { $ref: '#/components/schemas/PlayState' }
            score: { type: integer, nullable: true }
            code_language:
              allOf: [ { $ref: '#/components/schemas/CodeLanguage' } ]
              nullable: true
              description: Solo big-o y bug-hunt al cerrar; null en los demás casos (igual que PlayView)
        result:
          allOf: [ { $ref: '#/components/schemas/Result' } ]
          nullable: true
          description: Solo si la jugada cerró la partida
        streaks:
          allOf: [ { $ref: '#/components/schemas/Streaks' } ]
          nullable: true
          description: Solo si la jugada cerró la partida
        game_stats:
          allOf: [ { $ref: '#/components/schemas/GameStatsView' } ]
          nullable: true
          description: Solo si la jugada cerró la partida

    AcknowledgeVoidResponse:
      type: object
      required: [play, streaks]
      properties:
        play:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [voided] }
        streaks: { $ref: '#/components/schemas/Streaks' }

    ReportRequest:
      type: object
      required: [challenge_number, reason]
      properties:
        challenge_number: { type: integer, minimum: 1 }
        reason: { $ref: '#/components/schemas/ReportReason' }
        message: { type: string, maxLength: 1000 }
        code_language:
          allOf: [ { $ref: '#/components/schemas/CodeLanguage' } ]
          description: Solo big-o y bug-hunt; si la Play tiene `code_language`, manda la Play

    # ─────────── Stats ───────────
    GameStatsView:
      type: object
      required: [game_id, current_streak, max_streak, played, wins, win_rate, extra]
      properties:
        game_id: { $ref: '#/components/schemas/GameId' }
        current_streak: { type: integer, minimum: 0, description: Racha viva }
        max_streak: { type: integer, minimum: 0 }
        played: { type: integer, minimum: 0, description: Excluye Play voided }
        wins: { type: integer, minimum: 0, description: Excluye Play voided }
        win_rate:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: '`wins / played`; null si `played = 0`'
        extra:
          type: object
          additionalProperties: true
          description: |
            Stats propias del juego (`reduceStats`):
            devdle = distribución de intentos (1–6 y derrotas);
            grep-grid = `{ words_found: { "0": n, …, "8": n } }` (partidas por cantidad de palabras encontradas;
            de ahí salen el promedio de palabras y el % de 8/8);
            timeline = `{ by_category: { <category>: { played, correct } } }`, acumulado por hito: cada uno de los 5 items suma `played` a la categoría de su hecho y `correct` si quedó en su lugar (acierto = `correct / played`; mejor categoría = mayor promedio); big-o = `{ by_category: { <recipe_category>: { played, correct } } }`;
            bug-hunt = aciertos por `code_language` y por `bug_type`.

    MyStats:
      type: object
      required: [global, games, heatmap, history, history_next_before]
      properties:
        global:
          type: object
          required: [current_streak, max_streak, total_completed]
          properties:
            current_streak: { type: integer, minimum: 0 }
            max_streak: { type: integer, minimum: 0 }
            total_completed: { type: integer, minimum: 0, description: Incluye Play voided }
        games:
          type: array
          items: { $ref: '#/components/schemas/GameStatsView' }
        heatmap:
          type: array
          description: Últimos 365 días
          items:
            type: object
            required: [date, completed]
            properties:
              date: { type: string, format: date }
              completed: { type: integer, minimum: 0, maximum: 5, description: Play completadas ese día }
        history:
          type: array
          maxItems: 60
          items:
            type: object
            required: [date, number, game_id, status, label]
            properties:
              date: { type: string, format: date }
              number: { type: integer, minimum: 1 }
              game_id: { $ref: '#/components/schemas/GameId' }
              status: { $ref: '#/components/schemas/PlayStatus' }
              label: { type: string, description: '`historyLabel(result)`' }
        history_next_before:
          type: string
          format: date
          nullable: true
          description: Valor para pedir la página siguiente; null si no hay más

    # ─────────── Admin ───────────
    AdminLoginResponse:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }

    AdminChallenge:
      type: object
      required: [id, game_id, date, number, status, payload, verification, void_reason, voided_at, culprits]
      properties:
        id: { type: string, format: uuid }
        game_id: { $ref: '#/components/schemas/GameId' }
        date: { type: string, format: date }
        number: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ChallengeStatus' }
        payload:
          type: object
          additionalProperties: true
          description: '`challenges.payload` completo: incluye la solución y los textos `{ es, en }`'
        verification:
          type: object
          additionalProperties: true
          description: '`challenges.verification`: log de la verificación'
        void_reason: { type: string, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        culprits:
          type: array
          description: Ítems de banco referenciados por el desafío (`GameDefinition.culprits`)
          items:
            type: object
            required: [kind, id, label]
            properties:
              kind: { type: string, enum: [term, timeline_fact] }
              id: { type: string, format: uuid }
              label: { type: string }

    AdminReport:
      type: object
      required: [id, reason, message, locale, context, status, created_at, player_ref]
      properties:
        id: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/ReportReason' }
        message: { type: string, nullable: true }
        locale: { $ref: '#/components/schemas/Locale' }
        context:
          type: object
          description: '`code_language`, `play_status`, `play_state`, `user_agent`'
          additionalProperties: true
        status: { $ref: '#/components/schemas/ReportStatus' }
        created_at: { type: string, format: date-time }
        player_ref:
          type: string
          pattern: '^[0-9a-f]{8}$'
          description: Primeros 8 hex de sha256(player_id); identifica al jugador sin exponer el nd_pid

    ReportGroup:
      type: object
      description: Orden, `alerted_at` no nulo primero, `report_count` desc, `challenge.date` desc. `report_count` y `reasons` cuentan solo los reportes del estado filtrado
      required: [challenge, alerted_at, report_count, reasons, reports]
      properties:
        challenge: { $ref: '#/components/schemas/AdminChallenge' }
        alerted_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo alcanzó el umbral de reportes (ADR-017). `null` si no lo alcanzó
        report_count: { type: integer, minimum: 1 }
        reasons:
          type: object
          description: Conteo por `reason`
          additionalProperties: { type: integer }
          example: { wrong_answer: 3, translation: 1 }
        reports:
          type: array
          items: { $ref: '#/components/schemas/AdminReport' }

    VoidRequest:
      type: object
      required: [void_reason, culprit]
      properties:
        void_reason: { type: string, minLength: 1, maxLength: 500, description: Se aplica trim }
        culprit:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [term, timeline_fact, template, none]
              description: '`template` solo queda en `void_reason` (se corrige en código)'
            id:
              type: string
              format: uuid
              description: Obligatorio si `kind` es `term` o `timeline_fact`, prohibido si no; debe estar en `AdminChallenge.culprits`

    UpcomingDay:
      type: object
      required: [date, number, games]
      properties:
        date: { type: string, format: date }
        number: { type: integer, minimum: 1 }
        games:
          type: array
          items:
            type: object
            required: [game_id, challenge, regeneration, failure]
            properties:
              game_id: { $ref: '#/components/schemas/GameId' }
              challenge:
                type: object
                nullable: true
                required: [id, status, payload, verification, generator_version, attempt, rejected_items]
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/ChallengeStatus' }
                  payload: { type: object, additionalProperties: true }
                  verification: { type: object, additionalProperties: true }
                  generator_version: { type: string }
                  attempt: { type: integer, minimum: 0, description: El seed derivado nunca se devuelve }
                  rejected_items:
                    type: array
                    description: Ítems de banco del payload (`definition.culprits`) que hoy están `rejected`; vacío si ninguno
                    items:
                      type: object
                      required: [kind, id, label, rejection_reason]
                      properties:
                        kind: { type: string, enum: [term, timeline_fact] }
                        id: { type: string, format: uuid }
                        label: { type: string }
                        rejection_reason: { type: string }
              regeneration:
                type: object
                nullable: true
                description: |
                  Último pedido de regeneración del challenge vigente, solo si está `pending` o `failed`.
                  null si no hay pedido o el último está `done` o `cancelled`.
                required: [request_id, status, error, requested_at, processed_at]
                properties:
                  request_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, failed] }
                  error: { type: string, nullable: true }
                  requested_at: { type: string, format: date-time }
                  processed_at: { type: string, format: date-time, nullable: true }
              failure:
                type: object
                nullable: true
                description: Falla de generación registrada para ese juego y fecha (ADR-017). Solo cuando `challenge` es `null`
                required: [attempts, last_reason, updated_at]
                properties:
                  attempts: { type: integer, minimum: 1 }
                  last_reason: { type: string, nullable: true }
                  updated_at: { type: string, format: date-time }

    BankStock:
      type: object
      required: [bank, approved_available, approved_total, rejected_total, days_of_stock, cycle_ok, consumers, rejections]
      properties:
        bank: { type: string, enum: [terms, timeline_facts] }
        approved_available:
          type: integer
          description: Ítems approved disponibles para todos los consumidores del banco (fuera de su ventana anti-repetición)
        approved_total: { type: integer }
        rejected_total: { type: integer }
        days_of_stock:
          type: integer
          description: Mínimo de `days_of_stock` de los consumidores; por consumidor, `floor(approved_available / items_per_challenge)`
        cycle_ok:
          type: boolean
          description: |
            true si todos los consumidores son `cycle_ok`; por consumidor,
            `approved_total >= items_per_challenge × window_days` (Devdle 365, Grep Grid 240, Timeline 450).
            Reemplaza la regla fija terms ≥ 500 (era el umbral de la importación, C-50)
        consumers:
          type: array
          description: Un item por juego que consume el banco (`GameDefinition.bankUsage`); `terms` = Devdle y Grep Grid
          items:
            type: object
            required: [game_id, window_days, items_per_challenge, approved_available, days_of_stock, cycle_ok]
            properties:
              game_id: { $ref: '#/components/schemas/GameId' }
              window_days: { type: integer }
              items_per_challenge: { type: integer }
              approved_available: { type: integer }
              days_of_stock: { type: integer }
              cycle_ok: { type: boolean }
        rejections:
          type: array
          description: Ítems `rejected` (por la importación o por anulación), del más reciente al más antiguo; máximo 200
          maxItems: 200
          items:
            type: object
            required: [wikidata_id, label, reason]
            properties:
              wikidata_id: { type: string }
              label: { type: string }
              reason: { type: string }

    Metrics:
      type: object
      required: [daily_players, retention, streak_distribution, challenge_quality]
      properties:
        daily_players:
          type: array
          description: metrics_daily_players
          items:
            type: object
            required: [date, game_id, players]
            properties:
              date: { type: string, format: date }
              game_id:
                allOf: [ { $ref: '#/components/schemas/GameId' } ]
                nullable: true
                description: null = total
              players: { type: integer }
        retention:
          type: array
          description: metrics_retention
          items:
            type: object
            required: [cohort_date, cohort_size, d1, d7]
            properties:
              cohort_date: { type: string, format: date }
              cohort_size: { type: integer }
              d1: { type: number, nullable: true, description: '% (0–1); null si la cohorte no llegó a +1' }
              d7: { type: number, nullable: true, description: '% (0–1); null si la cohorte no llegó a +7' }
        streak_distribution:
          type: array
          description: metrics_streak_distribution
          items:
            type: object
            required: [bucket, players]
            properties:
              bucket: { type: string, enum: ['0', '1', '2-6', '7-29', '30+'] }
              players: { type: integer }
        challenge_quality:
          type: array
          description: metrics_challenge_quality
          items:
            type: object
            required: [challenge_id, game_id, date, number, started, finished, completion_rate, win_rate, reports, status]
            properties:
              challenge_id: { type: string, format: uuid }
              game_id: { $ref: '#/components/schemas/GameId' }
              date: { type: string, format: date }
              number: { type: integer }
              started: { type: integer }
              finished: { type: integer, description: won + lost }
              completion_rate: { type: number, nullable: true }
              win_rate: { type: number, nullable: true }
              reports: { type: integer }
              status: { $ref: '#/components/schemas/ChallengeStatus' }
