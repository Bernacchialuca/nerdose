name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, build y tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Versión de pnpm: la de `packageManager` en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Toolchains de @nerdose/polyglot, big-o y bug-hunt (README, Requisitos).
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Los tests de polyglot, big-o y bug-hunt compilan Go con un timeout de 10 s (ADR-007). Con la
      # caché de Go vacía, el primer `go build` compila la librería estándar y se pasa de ese tiempo:
      # se precompila `fmt`, lo único que importa el Go emitido.
      - name: Precalentar la caché de Go
        run: |
          d="$(mktemp -d)"
          printf 'package main\n\nimport "fmt"\n\nfunc main() { fmt.Println("ok") }\n' > "$d/main.go"
          cd "$d" && go build -o main main.go && ./main

      - name: Cache de Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Los tests de integración usan Testcontainers: el runner ya trae Docker.
      - run: pnpm test

  images:
    name: Imagen ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [api, generator, migrate, static]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Solo verifica que la imagen se construya: publicarla y desplegarla se define con el hosting.
      - name: Build (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
