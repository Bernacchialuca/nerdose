        name: name, streak: streak, best: best, href: href, metrics: metrics,
        bar: 'height: 4px; background: ' + color,

      };
    }
    var games = [

class Component extends DCLogic {
  renderVals() {

    var st = {
      g: base + 'background: #3DDC84; color: #06120B; border: 2px solid #3DDC84',
      y: base + 'background: transparent; color: #FFB547; border: 2px dashed #FFB547',

      e: base + 'background: transparent; color: #E6EDF3; border: 2px solid #222A33'
    };
    var names = { g: 'correcta', y: 'en otra posición', x: 'no está', t: 'escrita', e: 'vacía' };
    var guesses = [
      ['BRANCH', 'xxxxyx'],
      ['CLIENT', 'yxxyxg'],
      ['ROCKET', 'xggggg'],
      ['SO    ', 'tteeee'],
      ['      ', 'eeeeee'],
      ['      ', 'eeeeee']
    ];
    var rows = guesses.map(function (g) {
      var tiles = [];
      for (var i = 0; i < 6; i++) {
        var ch = g[0][i] === ' ' ? '' : g[0][i];
        var s = g[1][i];
        tiles.push({ ch: ch, style: st[s], label: (ch || 'casilla') + ', ' + names[s] });
      }
      return { tiles: tiles };
    });
    var state = {};
    'BRANHLI'.split('').forEach(function (c) { state[c] = 'x'; });
    'OCKET'.split('').forEach(function (c) { state[c] = 'g'; });
    var kb = 'height: 54px; border-radius: 8px; border: none; cursor: pointer; font-family: \'JetBrains Mono\', monospace; font-weight: 700; font-size: 15px; ';
    function key(c) {
      var s = state[c];
      var style = kb + 'flex: 1 1 0; min-width: 0; max-width: 52px; ';
      if (s === 'g') style += 'background: #3DDC84; color: #06120B';
      else if (s === 'x') style += 'background: #12161B; color: #5F6B78; text-decoration: line-through';
      else style += 'background: #2A323C; color: #E6EDF3';

    }
    var keyboard = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'].map(function (r, i) {

      }
      return { keys: keys };
    });
    var counts = [['1', 0], ['2', 3], ['3', 11], ['4', 19], ['5', 9], ['6', 4], ['X', 2]];
    var dist = counts.map(function (c) {
      var w = Math.max(8, Math.round(c[1] / 19 * 100));
      var bg = c[0] === '4' ? '#3DDC84' : '#2A323C';
      var col = c[0] === '4' ? '#06120B' : '#E6EDF3';

    });
    return { rows: rows, keyboard: keyboard, dist: dist };
  }
}

<script type="text/plain" id="js-BugHunt">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'js', picked: null, done: false };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var lang = st.lang;
    var BUG = 4;
    var PICKABLE = [2, 3, 4, 5, 8];
    var src = {
      js: ['function maxIndex(nums) {', '  let best = 0;', '  for (let i = 1; i < nums.length; i++) {', '    if (nums[i] >= nums[best]) {', '      best = i;', '    }', '  }', '  return best;', '}'],
      go: ['func maxIndex(nums []int) int {', '\tbest := 0', '\tfor i := 1; i < len(nums); i++ {', '\t\tif nums[i] >= nums[best] {', '\t\t\tbest = i', '\t\t}', '\t}', '\treturn best', '}'],
      java: ['static int maxIndex(int[] nums) {', '    int best = 0;', '    for (int i = 1; i < nums.length; i++) {', '        if (nums[i] >= nums[best]) {', '            best = i;', '        }', '    }', '    return best;', '}']
    };
    var fixed = { js: 'if (nums[i] > nums[best]) {', go: 'if nums[i] > nums[best] {', java: 'if (nums[i] > nums[best]) {' };
    var files = { js: 'max-index.js', go: 'max_index.go', java: 'MaxIndex.java' };
    var calls = { js: 'maxIndex([5, 1, 5])', go: 'maxIndex([]int{5, 1, 5})', java: 'maxIndex(new int[]{5, 1, 5})' };
    var names = { js: 'JavaScript', go: 'Go', java: 'Java' };

    var code = src[lang].map(function (t, i) {
      var n = i + 1;
      var canPick = PICKABLE.indexOf(n) >= 0;
      var isPick = st.picked === n;
      var isBug = n === BUG;
      var tag = '', tagColor = '#FFB547', bg = 'transparent', bar = 'transparent';
      if (!st.done) {
        if (isPick) { tag = '◀ tu elección'; bg = '#1A140A'; bar = '#FFB547'; }
      } else if (isBug && isPick) {
        tag = '✓ acá estaba el bug'; tagColor = '#3DDC84'; bg = '#0C1A12'; bar = '#3DDC84';
      } else if (isBug) {
        tag = '🐛 acá estaba el bug'; bg = '#1A140A'; bar = '#FFB547';
      } else if (isPick) {
        tag = '✗ tu elección'; tagColor = '#FF7B72'; bg = '#1C0F0E'; bar = '#FF7B72';
      }
      var interactive = canPick && !st.done;
      return {
        n: n,
        text: t,
        tag: tag,
        checked: isPick ? 'true' : 'false',
        aria: 'Línea ' + n + (canPick ? '' : ' (no elegible)'),
        locked: !interactive,
        cls: interactive ? 'bh-pick' : '',
        pick: interactive ? function () { self.setState({ picked: n }); } : null,
        tagStyle: tag ? 'margin-left: auto; padding-left: 20px; flex: none; font-size: 12px; font-weight: 700; color: ' + tagColor : 'display: none',
        style: 'display: flex; align-items: center; width: 100%; min-height: 40px; padding: 0 18px; border: none; text-align: left; font-family: \'JetBrains Mono\', monospace; font-size: 15px; line-height: 2; tab-size: 4; color: ' + (canPick ? '#E6EDF3' : '#8D99A6') + '; background: ' + bg + '; box-shadow: inset 3px 0 0 ' + bar + '; cursor: ' + (interactive ? 'pointer' : 'default')
      };
    });

    var tabs = ['js', 'go', 'java'].map(function (k) {
      var sel = k === lang;
      return {
        label: names[k],
        selected: sel ? 'true' : 'false',
        pick: function () { self.setState({ lang: k }); },
        style: 'min-height: 40px; padding: 0 16px; border-radius: 8px; border: none; cursor: pointer; font-family: \'JetBrains Mono\', monospace; font-size: 13px; ' + (sel ? 'background: #2A1F0B; color: #FFB547; font-weight: 700' : 'background: transparent; color: #9AA6B2')
      };
    });

    var ready = st.picked != null;
    var won = st.done && st.picked === BUG;
    return {
      code: code,
      tabs: tabs,
      file: files[lang],
      playing: !st.done,
      done: st.done,
      won: won,
      lost: st.done && !won,
      lostTitle: 'El bug estaba en la línea ' + BUG + ', no en la ' + st.picked,
      passing: ['[3, 7, 2] → 1', '[4] → 0', '[-2, -9, -1] → 2'],
      notReady: !ready,
      confirmLabel: ready ? 'Confirmar línea ' + st.picked + ' →' : 'Elegí una línea',
      confirm: function () { if (self.state.picked != null) self.setState({ done: true }); },
      confirmStyle: 'min-height: 48px; padding: 0 22px; border-radius: 10px; border: none; font-family: \'JetBrains Mono\', monospace; font-weight: 700; font-size: 15px; ' + (ready ? 'background: #FFB547; color: #1A1206; cursor: pointer' : 'background: #2A2416; color: #8A7856; cursor: not-allowed'),
      failCall: calls[lang],
      diffOld: src[lang][BUG - 1].trim(),
      diffNew: fixed[lang],
      shareText: '🐛 Bug Hunt #128 · ' + names[lang] + '\n' + (won ? '🟩 bug encontrado' : '🟥 se me escapó') + '\nnerdose.dev',
      restart: function () { self.setState({ picked: null, done: false }); }
    };
  }
}
</script>

<script type="text/plain" id="js-GrepGrid">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { found: ['MUTEX', 'TOKEN', 'KERNEL'], start: null, miss: false };
  }
  renderVals() {
    var self = this;
    var rows = ['VFSMUTEXTFCS', 'IBDWECCAOAZZ', 'IHIEDRUFLJCF', 'FIRFPWGIVXJO', 'XKPPDLAEJMKN', 'GIDIYRORGUNA', 'TOKENCHYEAME', 'BYFOXQARWGNS', 'HVXROUHCRVEA', 'MWTKWEVNHBYX', 'JEGBJRCCJEJY', 'FNTIEYKERNEL'];
    var pos = { KERNEL: [11, 6, 0, 1], DEPLOY: [1, 2, 1, 1], CACHE: [6, 5, 1, 1], MUTEX: [0, 3, 0, 1], REGEX: [5, 7, 1, 1], TOKEN: [6, 0, 0, 1], QUERY: [7, 5, 1, 0], MERGE: [0, 3, 1, 1] };
    var defs = {
      KERNEL: 'El núcleo del sistema operativo: gestiona memoria, procesos y hardware.',
      DEPLOY: 'Publicar una versión del software en un entorno, como producción.',
      CACHE: 'Almacenamiento rápido para no volver a calcular o pedir los mismos datos.',
      MUTEX: 'Un candado que deja entrar a un solo hilo por vez a una sección crítica.',
      REGEX: 'Un patrón para buscar y validar texto. Como el que usa grep.',
      TOKEN: 'Una credencial temporal que prueba quién sos ante una API.',
      QUERY: 'Una consulta a una base de datos.',
      MERGE: 'Une el historial de dos ramas en una.'
    };
    var order = ['KERNEL', 'DEPLOY', 'CACHE', 'MUTEX', 'REGEX', 'TOKEN', 'QUERY', 'MERGE'];
    var found = this.state.found, start = this.state.start;
    var hit = {};
    found.forEach(function (w) {
      var p = pos[w];
      for (var i = 0; i < w.length; i++) hit[(p[0] + p[2] * i) + ',' + (p[1] + p[3] * i)] = true;
    });
    function tryMatch(a, b) {
      for (var k = 0; k < order.length; k++) {
        var w = order[k], p = pos[w];
        var er = p[0] + p[2] * (w.length - 1), ec = p[1] + p[3] * (w.length - 1);
        if ((a[0] === p[0] && a[1] === p[1] && b[0] === er && b[1] === ec) || (b[0] === p[0] && b[1] === p[1] && a[0] === er && a[1] === ec)) return w;
      }
      return null;
    }
    var base = 'width: 48px; height: 48px; border-radius: 8px; font-family: \'JetBrains Mono\', monospace; font-weight: 700; font-size: 18px; cursor: pointer; ';
    var cells = [];
    rows.forEach(function (row, r) {
      row.split('').forEach(function (ch, c) {
        var key = r + ',' + c;
        var isStart = start && start[0] === r && start[1] === c;
        var style = base + (isStart ? 'background: #2A0F22; color: #F9A8D4; border: 2px solid #F472B6'
          : hit[key] ? 'background: #F472B6; color: #24081A; border: 2px solid #F472B6'
          : 'background: #141920; color: #C3CCD5; border: 2px solid #141920');
        cells.push({
          ch: ch, style: style,
          aria: ch + ', fila ' + (r + 1) + ', columna ' + (c + 1),
          pick: function () {
            if (!self.state.start) { self.setState({ start: [r, c], miss: false }); return; }
            var w = tryMatch(self.state.start, [r, c]);
            if (w && self.state.found.indexOf(w) < 0) self.setState({ found: self.state.found.concat([w]), start: null, miss: false });
            else self.setState({ start: null, miss: !(self.state.start[0] === r && self.state.start[1] === c) });
          }
        });
      });
    });
    var words = order.map(function (w) {
      var f = found.indexOf(w) >= 0;
      return {
        word: w, found: f, def: defs[w], tag: f ? '✓' : w.length + ' letras',
        rowStyle: 'display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 10px; ' + (f ? 'background: #1F0D19; border: 1px solid #5B2147' : 'background: #141920; border: 1px solid #141920'),
        nameStyle: 'font-family: \'JetBrains Mono\', monospace; font-weight: 700; font-size: 15px; ' + (f ? 'color: #F9A8D4; text-decoration: line-through' : 'color: #E6EDF3'),
        tagStyle: 'font-family: \'JetBrains Mono\', monospace; font-size: 12px; ' + (f ? 'color: #F472B6; font-weight: 800' : 'color: #8D99A6')
      };
    });
    var hint = start ? '> ahora tocá la última letra' : this.state.miss ? '> no es una palabra de la lista, probá de nuevo' : '> tocá la primera letra de una palabra';
    return { cells: cells, words: words, foundCount: found.length, hint: hint };
  }
}

<script>
(function () {
  function DCLogic(props) { this.props = props || {}; this.state = {}; }

    var inst = getInst(current);

    tpl.content.childNodes.forEach(function (c) { walk(c, vals, frag); });

  try { lang = localStorage.getItem('nerdose-lang') || (navigator.language || '').slice(0, 2) === 'en' && 'en' || 'es'; } catch (e) {}
